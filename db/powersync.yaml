# PowerSync Open Edition Configuration for ethan_workbench

replication:
  connections:
    - type: postgresql
      hostname: postgres
      port: 5432
      database: ethan_workbench
      username: ethan_workbench
      password: !env PS_PG_PASSWORD
      sslmode: disable
      id: ethan_workbench

storage:
  type: postgresql
  hostname: postgres
  port: 5432
  database: ethan_workbench
  username: ethan_workbench
  password: !env PS_PG_PASSWORD
  sslmode: disable

# PS_JWT_KEY is the base64url-encoded HMAC key (the JWK `k`); it must match the
# raw secret the app signs with (POWERSYNC_JWT_SECRET in Flutter/ethan_workbench/.env,
# base64-encoded).
client_auth:
  jwks:
    keys:
      - kty: oct
        kid: ethan-workbench-dev-key
        k: !env PS_JWT_KEY
        alg: HS256
  audience:
    - powersync

sync_rules:
  content: |
    bucket_definitions:
      ethan_workbench_global:
        priority: 0
        data:
          - SELECT * FROM deploy_runs
          - SELECT * FROM deploy_state
